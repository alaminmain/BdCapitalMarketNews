name: Daily BD Markets News Run

on:
  schedule:
    # 03:00 UTC = 09:00 Asia/Dhaka (UTC+6, no DST). DSE opens 10:00 local.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changes: ${{ steps.commit.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_PUBLIC_URL: ${{ vars.FEED_PUBLIC_URL }}
          # Manual triggers wipe today's seen_headlines so the full
          # day's batch re-enters the pipeline. Scheduled cron runs
          # respect the dedup so they only process truly-new items.
          EXTRA_FLAGS: ${{ github.event_name == 'workflow_dispatch' && '--reset-today' || '' }}
        run: python main.py --verbose $EXTRA_FLAGS

      - name: Sanity-check generated artifacts
        run: |
          test -s docs/feed.xml      || { echo "feed.xml missing/empty";    exit 1; }
          test -s docs/index.html    || { echo "index.html missing/empty";  exit 1; }
          test -s docs/history.json  || { echo "history.json missing/empty"; exit 1; }
          python - <<'PY'
          import json, sys
          d = json.load(open('docs/history.json', encoding='utf-8'))
          rows = d.get('rows') or []
          if not rows:
              print('history.json has zero rows', file=sys.stderr)
              sys.exit(1)
          print(f'history.json ok: {len(rows)} rows')
          PY

      - name: Commit data refresh to main
        id: commit
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/index.html docs/history.json market_updates.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): daily refresh $DATE"
          # Push straight to main. GITHUB_TOKEN-driven pushes don't trigger
          # downstream on:push workflows, which is why deploy-pages stays in
          # this same workflow file (see the deploy-pages job below).
          git push origin HEAD:main
          echo "changes=true" >> "$GITHUB_OUTPUT"

  deploy-pages:
    needs: refresh
    if: needs.refresh.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Share the Pages deploy slot with deploy-pages.yml so cron and a
    # human-merged source PR never race each other.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main (post-merge)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
